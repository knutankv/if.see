<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free IFC Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: exact and quiet, a drawing set rather than a dashboard
   IDEA: an architect's model table under a work lamp
   PICTURE: the 3D model itself fills the frame; one safety-yellow highlight marks the selection
   COLOUR and TYPE: white, black, concrete planes, #ffe600 only for selection; Hanken Grotesk
   LAYOUT: thin toolbar, tree left, model centre, properties right; stacks below 1000px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#1a1a19);--ink:light-dark(#141414,#ececea);--mute:light-dark(#68685f,#9d9d96);--line:light-dark(#e3e3df,#33332f);--panel:light-dark(#fafaf8,#1f1f1e);--hover:light-dark(#efefeb,#2a2a28);--btn:light-dark(#141414,#ececea);--btnink:light-dark(#fff,#141414);--hi:#ffe600}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Hanken Grotesk',system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;white-space:nowrap}
.file{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
button,.btn{font:inherit;font-size:14px;min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{background:var(--hover)}
button:focus-visible,.btn:focus-within,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.primary{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.primary:hover{background:var(--btn);opacity:.88}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.sec{display:none;align-items:center;gap:6px}.sec.on{display:inline-flex}
input[type=range]{width:120px;accent-color:var(--ink)}
@media(pointer:coarse){button,.btn{min-height:44px}}
.main{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;min-height:0}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);border-bottom:2px solid transparent;min-height:42px;justify-content:center}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{background:var(--hover)}
.ptitle{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;flex:none}
.pane{overflow:auto;flex:1;padding:6px 0 12px}
.pane[hidden]{display:none}
.foot{font-size:12.5px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 6px;cursor:pointer;border-radius:4px;white-space:nowrap;font-size:14px;margin:0 6px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--hi);color:#141414}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.cnt{margin-left:auto;color:var(--mute);font-size:12.5px;padding-left:8px;flex:none}
.row.sel .cnt{color:#44443d}
.tree details>.kids{padding-left:12px}
.tree summary{list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'';flex:none;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.45;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.leaf{padding-left:22px}
.eye{margin:0;width:15px;height:15px;accent-color:var(--ink);flex:none}
.cls{cursor:default}.cls input{margin:0;width:16px;height:16px;accent-color:var(--ink)}
.sw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.15)}
#view{position:relative;background:linear-gradient(light-dark(#f7f7f4,#262624),light-dark(#d8d8d4,#151514));overflow:hidden;touch-action:none;min-height:300px}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hint{position:absolute;left:12px;top:10px;font-size:12.5px;color:var(--mute);pointer-events:none;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:3px 8px;border-radius:4px}
#stat{position:absolute;right:12px;bottom:10px;font-size:12.5px;color:var(--mute);text-align:right;max-width:60%;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:3px 8px;border-radius:4px}
#busy,#drop{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px}
#busy.on,#drop.on{display:grid}
#busy{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:18px 22px;min-width:min(320px,90%);box-shadow:0 10px 40px rgba(0,0,0,.12)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#drop{background:color-mix(in srgb,var(--hi) 30%,transparent);border:3px dashed var(--ink);font-size:20px;font-weight:600;pointer-events:none}
#props .ph{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.pc{font-size:13px;color:var(--mute)}
#props h2{font-size:20px;line-height:1.2;margin:2px 0 8px;font-weight:600;overflow-wrap:anywhere}
.gid{display:flex;gap:8px;align-items:center}
.gid code{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.sm{min-height:30px;padding:0 9px;font-size:13px}
#props details{border-bottom:1px solid var(--line)}
#props summary{padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;gap:6px}
#props summary:hover{background:var(--hover)}
.kv{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:8px;table-layout:fixed}
.kv th{text-align:left;font-weight:400;color:var(--mute);padding:3px 8px 3px 14px;width:44%;vertical-align:top;overflow-wrap:anywhere}
.kv td{padding:3px 14px 3px 0;overflow-wrap:anywhere}
.empty{padding:22px 16px;color:var(--mute)}
.empty b{color:var(--ink);font-weight:600}
.note{padding:10px 14px;color:var(--mute);font-size:13.5px;margin:0}
.err{color:#b3261e}
@media(max-width:1000px){
 .app{height:auto;display:block}
 .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
 #view{height:64vh;order:1}
 #left{order:2;border-right:0;border-top:1px solid var(--line)}
 #right{order:3;border-left:0;border-top:1px solid var(--line)}
 .pane{max-height:55vh}
 .hint{display:none}
 #stat{max-width:calc(100% - 24px)}
}
@media(max-width:600px){.tools{margin-left:0}.file{max-width:60vw}input[type=range]{width:90px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z"/><path d="M3 7.5 12 12.5 21 7.5M12 12.5v9"/><path d="M12 12.5 21 7.5 12 2.5 3 7.5z" fill="#ffe600" stroke="none" opacity=".9"/><path d="M3 7.5 12 12.5 21 7.5 12 2.5z"/></svg>IFC Viewer</div>
 <div class="file" id="file">No file</div>
 <div class="tools">
  <label class="btn primary">Open IFC<input type="file" id="pick" accept=".ifc,.ifczip,.zip"></label>
  <button id="bSample">Sample</button>
  <span class="sep"></span>
  <button id="bFit" title="Fit view (F)">Fit</button>
  <button id="bX" aria-pressed="false" title="X-ray (X)">X-ray</button>
  <button id="bE" aria-pressed="true">Edges</button>
  <button id="bS" aria-pressed="false">Section</button>
  <span class="sec" id="secWrap"><input type="range" id="secR" min="0" max="1" step="0.001" value="0.6" aria-label="Section height"></span>
  <span class="sep"></span>
  <button id="bH" disabled title="Hide selected (H)">Hide</button>
  <button id="bI" disabled title="Isolate selected (I)">Isolate</button>
  <button id="bA" title="Show all (A)">Show all</button>
 </div>
</header>
<div class="main">
 <aside id="left">
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="tree">Model tree</button><button role="tab" aria-selected="false" data-tab="cls">Classes</button></div>
  <div class="pane tree" id="tree"></div>
  <div class="pane" id="cls" hidden></div>
  <div class="foot">Files open locally in your browser and are never uploaded.</div>
 </aside>
 <main id="view">
  <div class="hint">Drag to orbit · right-drag to pan · scroll to zoom · click to select · double-click to zoom in</div>
  <div id="stat"></div>
  <div id="drop">Drop your .ifc file to open it</div>
  <div id="busy"><div class="card"><div id="busyT">Loading viewer…</div><div class="bar"><i id="busyB"></i></div></div></div>
 </main>
 <aside id="right">
  <div class="ptitle">Properties</div>
  <div class="pane" id="props"></div>
 </aside>
</div>
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tick=()=>new Promise(r=>setTimeout(r,0));
const busy=(t,p)=>{$('#busy').classList.add('on');$('#busyT').textContent=t;$('#busyB').style.width=Math.round((p||0)*100)+'%';};
const idle=()=>$('#busy').classList.remove('on');
const fail=msg=>{busy('',0);$('#busyT').innerHTML='<b class="err">Could not open this file.</b><br>'+esc(msg);$('#busyB').parentNode.style.display='none';setTimeout(()=>{idle();$('#busyB').parentNode.style.display='';},6000);};
if(!window.THREE||!THREE.OrbitControls){busy('',0);$('#busyT').innerHTML='<b class="err">The 3D engine could not load.</b><br>Check your internet connection and reload.';throw new Error('three missing');}
const V=THREE.Vector3,V2=THREE.Vector2,M4=THREE.Matrix4;

/* ---------- STEP (ISO 10303-21) parser ---------- */
function decodeStr(s){
 s=s.replace(/''/g,"'");
 if(s.indexOf('\\')<0)return s;
 s=s.replace(/\\X2\\([0-9A-F]+)\\X0\\/gi,(m,h)=>{let o='';for(let i=0;i+4<=h.length;i+=4)o+=String.fromCharCode(parseInt(h.substr(i,4),16));return o;});
 s=s.replace(/\\X\\([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
 return s.replace(/\\S\\(.)/g,(m,c)=>String.fromCharCode(c.charCodeAt(0)+128)).replace(/\\\\/g,'\\');
}
function parseArgs(text,s){
 let i=s;
 const ws=()=>{while(text.charCodeAt(i)<=32)i++;};
 function val(){
  ws();const c=text[i];
  if(c==='('){i++;const arr=[];for(;;){ws();if(text[i]===')'){i++;return arr;}arr.push(val());ws();if(text[i]===',')i++;else if(text[i]!==')')throw new Error('bad list');}}
  if(c==="'"){let j=i+1;for(;;){const q=text.indexOf("'",j);if(q<0)throw new Error('bad string');if(text[q+1]==="'"){j=q+2;continue;}const raw=text.slice(i+1,q);i=q+1;return decodeStr(raw);}}
  if(c==='#'){let j=i+1;while(text.charCodeAt(j)>=48&&text.charCodeAt(j)<=57)j++;const r={r:+text.slice(i+1,j)};i=j;return r;}
  if(c==='$'||c==='*'){i++;return null;}
  if(c==='.'){const j=text.indexOf('.',i+1);const v=text.slice(i+1,j);i=j+1;return v==='T'?true:v==='F'?false:v==='U'?null:'.'+v+'.';}
  if(c==='"'){const j=text.indexOf('"',i+1);const v=text.slice(i+1,j);i=j+1;return v;}
  let j=i;while(j<text.length){const ch=text[j];if(ch===','||ch===')'||ch==='(')break;j++;}
  const tok=text.slice(i,j).trim();
  if(text[j]==='('){i=j;const inner=val();return{type:tok.toUpperCase(),v:inner.length===1?inner[0]:inner};}
  i=j;return parseFloat(tok);
 }
 return val();
}
class Model{
 constructor(text){
  this.text=text;this.ents=new Map();this.types=new Map();
  let i=text.indexOf('DATA;');if(i<0)throw new Error('This does not look like an IFC (STEP) file.');
  const hs=text.slice(0,i).match(/FILE_SCHEMA\s*\(\s*\(\s*'([^']+)'/i);this.schema=hs?hs[1]:'IFC';
  const n=text.length;i+=5;
  while(i<n){
   const c=text.charCodeAt(i);
   if(c===35){
    let j=i+1,id=0,d;
    while((d=text.charCodeAt(j)-48)>=0&&d<=9){id=id*10+d;j++;}
    while(text.charCodeAt(j)<=32)j++;
    if(text.charCodeAt(j)!==61){i=j;continue;}
    j++;while(text.charCodeAt(j)<=32)j++;
    const ts=j;while(j<n&&text.charCodeAt(j)!==40)j++;
    const type=text.slice(ts,j).trim().toUpperCase(),as=j;
    let k=j;
    while(k<n){const ch=text.charCodeAt(k);
     if(ch===39){k++;while(k<n){if(text.charCodeAt(k)===39){if(text.charCodeAt(k+1)===39){k+=2;continue;}break;}k++;}k++;continue;}
     if(ch===59)break;k++;}
    this.ents.set(id,{t:type,s:as,a:undefined});
    let l=this.types.get(type);if(!l)this.types.set(type,l=[]);l.push(id);
    i=k+1;
   }else if(c===69&&text.startsWith('ENDSEC',i))break;
   else if(c===47&&text.charCodeAt(i+1)===42){const e=text.indexOf('*/',i+2);i=e<0?n:e+2;}
   else i++;
  }
  if(!this.ents.size)throw new Error('The file contains no IFC entities.');
 }
 get(id){const e=this.ents.get(id);if(!e)return null;if(e.a===undefined){try{e.a=parseArgs(this.text,e.s);}catch(err){e.a=[];}if(!Array.isArray(e.a))e.a=[];}return e;}
 A(ref){return ref&&ref.r!=null?this.get(ref.r):null;}
 of(t){return this.types.get(t)||[];}
}

/* ---------- names, units, relationships ---------- */
const WORDS=new Set('wall standard case elemented slab door window column beam member plate railing stair flight ramp roof covering curtain furnishing element building proxy opening space flow terminal segment fitting controller duct pipe cable carrier storey site footing pile reinforcing bar mesh fastener mechanical discrete accessory distribution port chamber energy conversion device moving storage treatment annotation grid virtual transport system furniture shading chimney air light fixture sanitary unitary equipment valve pump tank fan filter boiler outlet switching alarm sensor actuator geographic civil course earthworks fill pavement kerb rail sign signal track deep foundation feature surface projection voiding assembly part bearing tendon anchor type heat exchanger coil damper box cooled electric appliance motor generator protective lamp communications audio visual fire suppression interceptor waste stack medical solar transformer tube bundle humidifier evaporator condenser chiller cooling tower compressor burner engine zone facility bridge road railway marine tunnel project vibration isolator spatial external alignment referent'.split(' '));
const PN=new Map();
function pretty(t){
 if(!t)return'';let r=PN.get(t);if(r)return r;
 const s=t.replace(/^IFC/,'').toLowerCase(),n=s.length,best=new Array(n+1).fill(null);best[0]=[];
 for(let i=0;i<n;i++){if(!best[i])continue;for(let j=i+1;j<=n;j++){const w=s.slice(i,j);if(WORDS.has(w)&&(!best[j]||best[j].length>best[i].length+1))best[j]=best[i].concat(w);}}
 r='Ifc'+(best[n]||[s]).map(w=>w[0].toUpperCase()+w.slice(1)).join('');PN.set(t,r);return r;
}
const SPATIAL=new Set(['IFCPROJECT','IFCSITE','IFCBUILDING','IFCBUILDINGSTOREY','IFCFACILITY','IFCFACILITYPART','IFCBRIDGE','IFCBRIDGEPART','IFCROAD','IFCROADPART','IFCRAILWAY','IFCRAILWAYPART','IFCMARINEFACILITY','IFCMARINEPART','IFCTUNNEL','IFCTUNNELPART','IFCSPATIALZONE','IFCEXTERNALSPATIALELEMENT']);
const PRE={EXA:1e18,PETA:1e15,TERA:1e12,GIGA:1e9,MEGA:1e6,KILO:1e3,HECTO:100,DECA:10,DECI:.1,CENTI:.01,MILLI:.001,MICRO:1e-6,NANO:1e-9};
const PSYM={KILO:'k',CENTI:'c',MILLI:'m',DECI:'d',MICRO:'µ'};
const SYM={METRE:'m',SQUARE_METRE:'m²',CUBIC_METRE:'m³',GRAM:'g',SECOND:'s',RADIAN:'rad',KELVIN:'K',DEGREE_CELSIUS:'°C',WATT:'W',NEWTON:'N',PASCAL:'Pa'};
const en=v=>typeof v==='string'?v.replace(/\./g,''):'';
function units(m){
 const U={len:1,ang:1,lab:{}};const pid=m.of('IFCPROJECT')[0];
 const ua=pid!=null?m.A(m.get(pid).a[8]):null;
 for(const r of (ua&&ua.a[0])||[]){
  const u=m.A(r);if(!u)continue;const ut=en(u.a[1]);
  if(u.t==='IFCSIUNIT'){const pre=en(u.a[2]),nm=en(u.a[3]);U.lab[ut]=(PSYM[pre]||'')+(SYM[nm]||nm.toLowerCase());if(ut==='LENGTHUNIT')U.len=PRE[pre]||1;}
  else if(u.t.startsWith('IFCCONVERSIONBASEDUNIT')){
   const mw=m.A(u.a[3]);let f=1;
   if(mw){const vv=mw.a[0];f=+(vv&&typeof vv==='object'?vv.v:vv)||1;const b=m.A(mw.a[1]);if(b&&b.t==='IFCSIUNIT')f*=PRE[en(b.a[2])]||1;}
   U.lab[ut]=String(u.a[2]||'').toLowerCase();if(ut==='LENGTHUNIT')U.len=f;if(ut==='PLANEANGLEUNIT')U.ang=f;
  }
 }
 return U;
}
function styleColor(m,x){
 if(Array.isArray(x)){for(const s of x){const c=styleColor(m,s);if(c)return c;}return null;}
 const e=m.A(x);if(!e)return null;
 if(e.t==='IFCPRESENTATIONSTYLEASSIGNMENT')return styleColor(m,e.a[0]);
 if(e.t==='IFCSURFACESTYLE')return styleColor(m,e.a[2]);
 if(e.t==='IFCSURFACESTYLERENDERING'||e.t==='IFCSURFACESTYLESHADING'){
  const c=m.A(e.a[0]);if(!c||c.t!=='IFCCOLOURRGB')return null;
  const tr=typeof e.a[1]==='number'?e.a[1]:0;
  return [c.a[1],c.a[2],c.a[3],Math.max(.08,1-tr)].map(v=>+(+v||0).toFixed(3));
 }
 return null;
}
function links(m){
 const R={parent:new Map(),kids:new Map(),contains:new Map(),psets:new Map(),type:new Map(),mat:new Map(),voids:new Map(),voidOf:new Map(),style:new Map(),matColor:new Map()};
 const each=(t,f)=>{for(const id of m.of(t)){const e=m.get(id);if(e)f(e.a);}};
 const push=(map,k,v)=>{let a=map.get(k);if(!a)map.set(k,a=[]);a.push(v);};
 const L=x=>Array.isArray(x)?x:[];
 each('IFCRELAGGREGATES',a=>{if(!a[4])return;for(const r of L(a[5])){R.parent.set(r.r,a[4].r);push(R.kids,a[4].r,r.r);}});
 each('IFCRELCONTAINEDINSPATIALSTRUCTURE',a=>{if(!a[5])return;for(const r of L(a[4])){if(!R.parent.has(r.r))R.parent.set(r.r,a[5].r);push(R.contains,a[5].r,r.r);}});
 each('IFCRELDEFINESBYPROPERTIES',a=>{const d=Array.isArray(a[5])?a[5]:[a[5]];for(const r of L(a[4]))for(const x of d)if(x&&x.r)push(R.psets,r.r,x.r);});
 each('IFCRELDEFINESBYTYPE',a=>{for(const r of L(a[4]))if(a[5])R.type.set(r.r,a[5].r);});
 each('IFCRELASSOCIATESMATERIAL',a=>{for(const r of L(a[4]))if(a[5])R.mat.set(r.r,a[5].r);});
 each('IFCRELVOIDSELEMENT',a=>{if(a[4]&&a[5]){push(R.voids,a[4].r,a[5].r);R.voidOf.set(a[5].r,a[4].r);}});
 each('IFCSTYLEDITEM',a=>{if(a[0]){const c=styleColor(m,a[1]);if(c)R.style.set(a[0].r,c);}});
 each('IFCMATERIALDEFINITIONREPRESENTATION',a=>{if(!a[3])return;for(const rr of L(a[2])){const rep=m.A(rr);for(const it of L(rep&&rep.a[3])){const si=m.A(it);if(si&&si.t==='IFCSTYLEDITEM'){const c=styleColor(m,si.a[1]);if(c&&!R.matColor.has(a[3].r))R.matColor.set(a[3].r,c);}}}});
 return R;
}
function matIds(m,ref,out=[],d=0){
 const e=m.A(ref);if(!e||d>6)return out;const a=e.a,L=x=>Array.isArray(x)?x:[];
 switch(e.t){
  case 'IFCMATERIAL':out.push(ref.r);break;
